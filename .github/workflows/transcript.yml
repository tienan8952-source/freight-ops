# 每天讀泛科學院 YouTube RSS，有新片就抓逐字稿寫進 Notion。
# 不用模擬瀏覽器（不用 Puppeteer），只用一般 HTTP 請求讀 RSS／影片頁原始碼／字幕 XML，
# 原因見 docs/tools/github-actions.md：YouTube 改版容易壞、用量大容易被封 IP。
#
# 需要的設定：
#   GitHub Actions Variable（Settings → Secrets and variables → Actions → Variables）
#     PANSCI_CHANNEL_ID   泛科學院頻道 ID（怎麼找見 docs/tools/github-actions.md）
#   GitHub Secrets（Settings → Secrets and variables → Actions → Secrets）
#     NOTION_API_KEY      Notion 整合金鑰（notion.so/my-integrations 建立）
#     NOTION_DATABASE_ID  逐字稿要寫進哪個 Notion 資料庫
name: 泛科學院逐字稿同步

on:
  schedule:
    - cron: '0 21 * * *' # 每天 UTC 21:00（台灣時間隔天 05:00）
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓新影片逐字稿寫進 Notion
        env:
          PANSCI_CHANNEL_ID: ${{ vars.PANSCI_CHANNEL_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node .github/scripts/transcript-sync.mjs
