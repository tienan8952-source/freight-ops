<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貨運行營運系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--panel:#FAFBFB;--ink:#16181D;--muted:#5C6370;--rule:#E3E5E9;--field:#F7F8F9;
--plate:#E8B51F;--plate-ink:#141414;--brand:#13453E;--brand-ink:#FFFFFF;
--danger:#A3302A;--ok:#1D6B4F;--warn:#8A5A00;--warnbg:#FBF0D8;--dangerbg:#FBE9E7;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#121417;--panel:#171A1E;--ink:#E8EAED;--muted:#9AA1AC;--rule:#2A2E34;--field:#1A1D21;
--brand:#2E8074;--brand-ink:#08110F;--danger:#E0736C;--ok:#4FBF95;--warn:#E8B51F;--warnbg:#2B2415;--dangerbg:#2E1917;}}
:root[data-theme="dark"]{--paper:#121417;--panel:#171A1E;--ink:#E8EAED;--muted:#9AA1AC;--rule:#2A2E34;--field:#1A1D21;
--brand:#2E8074;--brand-ink:#08110F;--danger:#E0736C;--ok:#4FBF95;--warn:#E8B51F;--warnbg:#2B2415;--dangerbg:#2E1917;}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.topbar{height:46px;box-sizing:border-box;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--rule);font-size:13.5px}
.topbar .who{color:var(--muted)}
.app{display:grid;grid-template-columns:206px 1fr;min-height:calc(100vh - 46px)}
@media (max-width:860px){.app{grid-template-columns:1fr}}
nav{background:var(--panel);border-right:1px solid var(--rule);padding:18px 0}
@media (max-width:860px){nav{border-right:none;border-bottom:1px solid var(--rule);padding:12px 0}}
nav .brand{padding:0 18px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--rule);margin-bottom:10px}
nav .grp{padding:14px 18px 5px;font-size:11.5px;color:var(--muted)}
nav a{display:block;padding:7px 18px;color:var(--ink);text-decoration:none;font-size:14.5px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--field)}
nav a.on{border-left-color:var(--brand);background:var(--field);font-weight:500}
nav a .badge{float:right;background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700;line-height:17px;margin-top:3px}
@media (max-width:860px){nav .grp{display:none}nav{display:flex;flex-wrap:wrap;gap:2px;padding:10px}nav .brand{width:100%;border:none;padding:0 8px 10px}nav a{border-left:none;border-radius:4px;padding:5px 11px;font-size:14px}nav a.on{background:var(--brand);color:var(--brand-ink)}}
main{padding:24px 26px 70px;max-width:1500px;overflow-x:hidden}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:11px;margin-bottom:20px}
h1{font-size:21px;font-weight:700;margin:0}
.head .sub{color:var(--muted);font-size:13px}.head .spacer{flex:1}
.split{display:grid;grid-template-columns:376px 1fr;gap:30px;align-items:start}
@media (max-width:1180px){.split{grid-template-columns:1fr;gap:24px}}
h2{font-size:14.5px;font-weight:700;margin:0 0 13px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}
.field{margin-bottom:3px}.c6{grid-column:span 6}.c12{grid-column:span 12}.c4{grid-column:span 4}
@media (max-width:520px){.c6,.c4{grid-column:span 12}}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
label .req{color:var(--danger)}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--field);color:var(--ink);font-family:inherit;font-size:15px}
textarea{resize:vertical;min-height:54px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
input.plateIn{font-family:"Roboto Mono",monospace;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
input.moneyIn{font-family:"Roboto Mono",monospace;font-weight:500;text-align:right}
.filebox{border:1px dashed var(--rule);border-radius:4px;padding:10px;background:var(--field);text-align:center}
.filebox input{display:none}
.filebox button{background:none;border:1px solid var(--rule);color:var(--ink);padding:5px 13px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13.5px}
.filebox p{margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:3px;border:1px solid var(--rule);display:block}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:19px;padding:0}
.actions{display:flex;gap:8px;margin-top:15px}
.btn{padding:8px 17px;border-radius:4px;border:1px solid transparent;font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:none;border-color:var(--rule);color:var(--ink)}
.btn-sm{padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.toast{margin-top:10px;font-size:13.5px;color:var(--ok);min-height:19px}
.toast.err{color:var(--danger)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .field{margin:0}.filters input,.filters select{min-width:118px}
.summary{display:flex;gap:26px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:14px}
.summary div span{display:block;font-size:11.5px;color:var(--muted)}
.summary div strong{font-size:19px;font-weight:700;font-family:"Roboto Mono",monospace}
.summary .alert strong{color:var(--danger)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:0 9px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 9px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th.num,td.num{text-align:right;padding-right:13px}
td.num{font-family:"Roboto Mono",monospace;font-weight:500;white-space:nowrap}
td .wrap2{white-space:pre-wrap;max-width:320px}
td .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-family:"Roboto Mono",monospace;font-weight:700;font-size:13.5px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;border:1.5px solid var(--plate-ink);white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--rule);border-radius:3px;padding:1px 7px;font-size:12px;white-space:nowrap}
.tag.w{background:var(--warnbg);color:var(--warn);border-color:transparent;font-weight:500}
.tag.d{background:var(--dangerbg);color:var(--danger);border-color:transparent;font-weight:500}
.tag.g{background:none;color:var(--ok);border-color:var(--ok)}
td.scans img{width:34px;height:34px;object-fit:cover;border-radius:3px;border:1px solid var(--rule);cursor:pointer;margin-right:3px}
.rowbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12.5px;padding:2px 4px;text-decoration:underline}
.rowbtn:hover{color:var(--ink)}.rowbtn.del:hover{color:var(--danger)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--rule);border-radius:5px;padding:13px 15px}
.card span{display:block;font-size:12.5px;color:var(--muted)}
.card strong{display:block;font-size:25px;font-weight:700;font-family:"Roboto Mono",monospace;margin-top:2px}
.card em{font-style:normal;font-size:12px;color:var(--muted)}
.card.alert{border-color:var(--danger)}.card.alert strong{color:var(--danger)}
dialog{border:none;border-radius:6px;padding:0;background:var(--paper);color:var(--ink);max-width:92vw;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog img{display:block;max-width:88vw;max-height:80vh}
dialog .dlgbar{display:flex;justify-content:flex-end;padding:8px}
footer{margin-top:36px;padding-top:13px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px}
.hint{background:var(--field);border-left:3px solid var(--brand);padding:10px 13px;font-size:13.5px;margin-bottom:18px;border-radius:0 4px 4px 0}
.hint.bad{border-left-color:var(--danger)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:28px 26px}
.authcard h1{font-size:19px;margin:0 0 4px}
.authcard .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.authtabs{display:flex;gap:6px;margin-bottom:18px}
.authtabs button{flex:1;padding:8px;border:1px solid var(--rule);background:var(--field);border-radius:4px;cursor:pointer;font-family:inherit;font-size:13.5px}
.authtabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.gatepage{max-width:480px;margin:60px auto;text-align:center}
.gatepage .icon{font-size:40px;margin-bottom:10px}
.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;padding:12px 0}
.permgrid label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);margin:0}
.permgrid input{width:auto}
@media (max-width:480px){.btn{min-height:44px}nav a{min-height:44px;display:flex;align-items:center}}
.bell{position:relative;background:none;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink)}
.bell .dot{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}
.belldrop{position:absolute;top:44px;right:0;width:320px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:20;text-align:left}
.belldrop .n{padding:10px 14px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13px}
.belldrop .n.unread{background:var(--field)}
.belldrop .n strong{display:block;font-size:13.5px;margin-bottom:2px}
.belldrop .empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.actionbanner{background:var(--danger);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.actionbanner strong{font-weight:700}
.actionbanner button{margin-left:auto;background:#fff;color:var(--danger);border:none;border-radius:4px;padding:6px 12px;font-family:inherit;font-weight:700;cursor:pointer}
.dropzone{border:2px dashed var(--rule);border-radius:8px;padding:30px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone.over{border-color:var(--brand);background:var(--field)}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px}
.filecard{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--field)}
.filecard .thumb{height:100px;display:flex;align-items:center;justify-content:center;background:var(--panel);font-size:32px;overflow:hidden}
.filecard .thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.filecard .meta{padding:8px;font-size:12px}
.filecard .meta strong{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steplist{display:flex;flex-direction:column;gap:8px}
.step{border:1px solid var(--rule);border-radius:6px;padding:10px;background:var(--field);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.timeline2{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--rule);margin-left:8px;padding-left:16px}
.timeline2 .ev{position:relative;padding:0 0 16px}
.timeline2 .ev:before{content:"";position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.progress{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:10px 0}
.progress b{display:block;height:100%;background:var(--brand)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="viewer"><div class="dlgbar"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('viewer').close()">關閉</button></div><img id="viewerImg" alt=""></dialog>

<script src="js/core.js"></script>
</body>
</html>
